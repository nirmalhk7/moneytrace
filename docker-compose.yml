services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: money_trace
      POSTGRES_USER: money_trace
      POSTGRES_PASSWORD: money_trace
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - money-trace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_trace -d money_trace"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  money-trace-postgres:
